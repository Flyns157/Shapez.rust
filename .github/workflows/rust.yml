name: Rust

on:
    push:
        branches: [main]
    pull_request:

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: fmt, clippy, tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Dépendances système de Bevy
              run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
            - name: Toolchain (rust-toolchain.toml)
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@v2
            - run: cargo fmt --all --check
            - run: cargo clippy --workspace --all-targets -- -D warnings
            - run: cargo test --workspace

    sim-only:
        name: crates sans Bevy
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@v2
            # Garantit que la simulation se compile et se teste sans Bevy.
            - run: cargo test -p shapez_core -p shapez_sim
            - name: Aucune dépendance Bevy dans la simulation
              run: "! cargo tree -p shapez_sim -e normal | grep -q bevy"

    wasm:
        name: build wasm32 (vérification)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup target add wasm32-unknown-unknown
            - uses: Swatinem/rust-cache@v2
            # Plan §9.3 : le jeu doit continuer de compiler pour le web (version jouable à venir).
            - run: cargo check --target wasm32-unknown-unknown -p shapez_game

    deny:
        name: cargo deny
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: EmbarkStudios/cargo-deny-action@v2
              with:
                  manifest-path: Cargo.toml

    bench:
        name: benchmarks de la simulation
        # Sur `main` seulement (plan §9.3) : les machines partagées de la CI sont trop
        # bruitées pour comparer une PR, mais l'historique des runs suit les tendances.
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@v2
            - run: cargo bench -p shapez_sim --bench tick -- --warm-up-time 1 --measurement-time 3
