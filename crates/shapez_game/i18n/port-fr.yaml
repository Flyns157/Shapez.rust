# Textes propres au portage Rust, absents des traductions du jeu d'origine.
port:
    hud:
        status: Tick <tick> - vitesse x<speed> - graine <seed> (ZQSD/flèches, molette, clic milieu ; Tab = vitesse, Espace = pause, Échap = menu)
        goal: "<level> - livrer <shape> : <delivered> / <required>"
        goalPerSecond: "<level> - livrer <shape> : <delivered> / <required> par seconde"
        freeplayLevel: Mode libre, niveau <level>
        wiresLayer: "[Couche câbles]"
        blueprint: "Plan : <count> bâtiments, coût <cost> formes de plan (en stock : <stock>) - clic = poser, R = tourner, clic droit/Échap = annuler"
        selection: "Sélection : <count> bâtiments - Suppr/X = supprimer, B = vider, Ctrl+C = copier, Ctrl+X = couper, Échap = annuler"
        placing: <variant> - rotation <degrees>° (R, T = variante, Q = pipette, X/clic droit = supprimer)
        wiresHelp: E = couche normale, clic sur un signal constant = changer sa valeur, clic sur un levier = basculer, Q = pipette, X/clic droit = supprimer
        help: Q = pipette, X/clic droit = supprimer, Ctrl+glisser = sélectionner, Ctrl+Z/Y = annuler/rétablir, Ctrl+V = coller, M = repère, F = améliorations, G = statistiques
        helpWires: ", E = couche câbles"
    notify:
        newBuildings: "Nouveau : <list>"
        buildingKey: <name> (touche <key>)
        buildingKeyWires: <name> (touche <key>, couche câbles avec E)
        upgradeBought: "Amélioration achetée : <name>, <tier>"
    editing:
        nothingToUndo: Rien à annuler
        nothingToRedo: Rien à rétablir
        noBlueprint: Aucun plan copié
        cleared: Items retirés de <count> bâtiment(s)
        blueprintsLocked: Les plans (copier-coller) se débloquent au niveau 12
        cannotAfford: "Pas assez de formes de plan : <cost> requises (<shape>)"
        cannotPlace: Aucun bâtiment du plan ne peut être posé ici
    menu:
        shapes: Formes
        savegames: Sauvegardes
        unreadable: <name> - illisible
        confirm: Confirmer
        folder: "Dossier : <path>"
        noSaveFolder: pas de dossier de sauvegardes
        loadFailed: "Impossible de charger <name> : <error>"
        deleteFailed: "Impossible de supprimer <name> : <error>"
    time:
        minutes: <minutes> min
        hoursMinutes: <hours> h <minutes> min
    marks:
        help: (M = ajouter, Maj+clic = retirer)
        pinned: Formes épinglées (Maj+clic = retirer)
    shop:
        help: (F ou Échap pour fermer ; clic sur une forme pour l'épingler)
        tier: "<name> - <tier> : <from> -> <to>"
        maxTier: <name> - niveau maximal (<mult>)
        pinned: (épinglée)
    statistics:
        help: (G pour fermer)
        empty: "Rien pour l'instant : les débits portent sur les 10 dernières secondes."
    signal:
        hint: Cliquez sur une valeur, ou tapez un code puis Entrée (Échap = annuler).
        code: "Code : <code>_"
        formats: 1 / 0, true / false, red, green, blue, yellow, purple, cyan, white, uncolored, ou une forme (CuCuCuCu, Sr------:Cg------)
        invalid: Code invalide
    settings:
        systemLanguage: Langue du système
        on: Activé
        off: Désactivé
    gallery:
        title: Galerie des formes (Échap = menu)
        cutLeft: découpe gauche
        cutRight: découpe droite
        rotate: rotation
        rotateCcw: rotation inverse
        rotate180: demi-tour
        stack: empilement
        paint: peinture
