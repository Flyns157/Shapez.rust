[package]
name = "shapez_game"
description = "Binaire Bevy : rendu, entrées, UI et cycle de vie de l'application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "shapez_game"

[dependencies]
bevy.workspace = true
shapez_core.workspace = true
shapez_sim.workspace = true
shapez_render_shapes.workspace = true
shapez_save.workspace = true
serde_norway = "0.9"
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
directories = "6"
# `SystemTime::now()` de std panique dans le navigateur ; identique à std ailleurs.
web-time = "1"

# Version web : assets lus par `fetch` avant le démarrage (voir `files.rs`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Navigator", "Response"] }

[features]
# Compilation incrémentale plus rapide en dev : `cargo run --features dev`.
dev = ["bevy/dynamic_linking", "bevy/bevy_dev_tools"]

[lints]
workspace = true
