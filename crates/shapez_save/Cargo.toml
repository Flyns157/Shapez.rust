[package]
name = "shapez_save"
description = "Format de sauvegarde natif : en-tête, état compressé, CRC32 et migrations."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
shapez_sim.workspace = true
serde.workspace = true
serde_json = "1"
zstd = { version = "0.13", default-features = false }
crc32fast = "1"
directories = "6"
# `SystemTime::now()` de std panique dans le navigateur ; identique à std ailleurs.
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["Window", "Storage"] }
wasm-bindgen = "0.2"
base64 = "0.22"


[dev-dependencies]
shapez_core.workspace = true

[lints]
workspace = true
